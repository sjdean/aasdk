syntax="proto2";

import "proto/service/sensor/message/LocationData.proto";
import "proto/service/sensor/message/CompassData.proto";
import "proto/service/sensor/message/SpeedData.proto";
import "proto/service/sensor/message/RPMData.proto";
import "proto/service/sensor/message/OdometerData.proto";
import "proto/service/sensor/message/FuelLevelData.proto";
import "proto/service/sensor/message/ParkingBrakeData.proto";
import "proto/service/sensor/message/GearData.proto";
import "proto/service/sensor/message/DiagnosticsData.proto";
import "proto/service/sensor/message/NightModeData.proto";
import "proto/service/sensor/message/EnvironmentData.proto";
import "proto/service/sensor/message/HVACData.proto";
import "proto/service/sensor/message/DrivingStatusData.proto";
import "proto/service/sensor/message/DeadReckoningData.proto";
import "proto/service/sensor/message/PassengerData.proto";
import "proto/service/sensor/message/DoorData.proto";
import "proto/service/sensor/message/LightData.proto";
import "proto/service/sensor/message/AccelerometerData.proto";
import "proto/service/sensor/message/GyroscopeData.proto";
import "proto/service/sensor/message/TirePressureData.proto";
import "proto/service/sensor/message/TollCardData.proto";
import "proto/service/sensor/message/GpsSatellite.proto";


package aasdk.proto.service.sensor.message;

message SensorBatch {
    repeated LocationData location_data = 1;
    repeated CompassData compass_data = 2;
    repeated SpeedData speed_data = 3;
    repeated RPMData rpm_data = 4;
    repeated OdometerData odometer_data = 5;
    repeated FuelLevelData fuel_data = 6;
    repeated ParkingBrakeData parking_brake_data = 7;
    repeated GearData gear_data = 8;
    repeated DiagnosticsData diagnostics_data = 9;
    repeated NightModeData night_mode_data = 10;
    repeated EnvironmentData environment_data = 11;
    repeated HVACData hvac_data = 12;
    repeated DrivingStatusData driving_status_data = 13;
    repeated DeadReckoningData dead_reckoning_data = 14;
    repeated PassengerData passenger_data = 15;
    repeated DoorData door_data = 16;
    repeated LightData light_data = 17;
    repeated TirePressureData tire_pressure_data = 18;
    repeated AccelerometerData accelerometer_data = 19;
    repeated GyroscopeData gyroscope_data = 20;
    repeated GpsSatelliteData gps_satellite_data = 21;
    repeated TollCardData toll_card_data = 22;
}