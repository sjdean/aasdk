syntax="proto2";

import "aap_protobuf/service/input/FeedbackEventType.proto";
import "aap_protobuf/service/input/message/TouchPadConfig.proto";
import "aap_protobuf/service/input/message/TouchScreenConfig.proto";

package aap_protobuf.service.input;

message InputSourceService
{
    repeated uint32 supported_keycodes = 1;
    repeated message.TouchScreenConfig touch_screen_config = 2;
    repeated message.TouchPadConfig touch_pad_config = 3;
    repeated FeedbackEventType feedback_events_types_supported = 4;
    optional uint32 display_id = 5;
}
