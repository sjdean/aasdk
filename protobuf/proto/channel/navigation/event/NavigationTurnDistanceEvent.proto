syntax="proto2";

import "proto/channel/navigation/event/DistanceUnit.proto";

package aasdk.proto.channel.navigation.event;

message NavigationTurnDistanceEvent
{
    option deprecated = true;
    required int32 distance_meters = 1;
    required int32 time_to_turn_seconds = 2;
    optional int32 display_distance_e3 = 3;
    optional DistanceUnit display_distance_unit = 4;
}
