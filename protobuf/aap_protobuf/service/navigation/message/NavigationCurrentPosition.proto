syntax="proto2";

import "aap_protobuf/service/navigation/message/NavigationStepDistance.proto";
import "aap_protobuf/service/navigation/message/NavigationDestinationDistance.proto";
import "aap_protobuf/service/navigation/message/NavigationRoad.proto";

package aap_protobuf.service.navigation.message;

message NavigationCurrentPosition {
  optional NavigationStepDistance step_distance = 1;
  repeated NavigationDestinationDistance destination_distances = 2;
  optional NavigationRoad current_road = 3;
}