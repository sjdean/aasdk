

syntax="proto2";

import "aap_protobuf/channel/navigation/event/NextTurn.proto";
import "aap_protobuf/channel/navigation/event/TurnSide.proto";

package aap_protobuf.channel.navigation.event;

message NavigationNextTurnEvent
{
    option deprecated = true;
    required string road = 1;
    optional TurnSide turn_side = 2;
    optional NextTurn next_turn_event = 3;
    optional bytes turn_image = 4;
    optional uint32 turn_number = 5;
    optional uint32 turn_angle = 6;
}
