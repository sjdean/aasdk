syntax="proto2";

option optimize_for=SPEED;

import "proto/shared/MessageStatus.proto";
import "proto/service/radio/message/RadioStationInfo.proto";

package aasdk.proto.service.radio.message;

message GetProgramListResponse {
  required shared.MessageStatus status = 1;
  required int32 radio_id = 2;
  required bool completed = 3;
  repeated RadioStationInfo program_list = 4;
}
